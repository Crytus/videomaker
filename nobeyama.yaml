video:
  width: 1920
  height: 1080
  fps: 30
  bgm: assets/sounds/BGM2-1.wav
  voice: narrator_male
  subtitle:
    position: bottom
    style:
      fill: "#FFFFFF"
      stroke: "#000000"
      padding: 32
scenes:
  - id: intro
    image: assets/images/DSC00052.JPG
    duration: 6
    voiceover: >
      山道からはずっと八ヶ岳が望めます。
    teletext:
      text: 飯盛山登山道からの八ヶ岳
      position: top_left
      style:
        fill: "#FFE066"
        stroke: "#222222"
  - id: river
    image: assets/images/DSC00042.JPG
    duration: 5
    teletext:
      text: 春の小川
      position: top_left
      style:
        fill: "#FFE066"
        stroke: "#222222"
    voiceover: >
      雪解け水が小川となって流れています。
    transition: cut
    voice_override:
      voice: narrator_male
      speed: 0.95
  - id: tenmondai
    image: assets/images/DSC00056.JPG
    duration: 5
    teletext:
      text: 国立天文台野辺山
      position: top_left
      style:
        fill: "#FFE066"
        stroke: "#222222"
    voiceover: >
      下山口の近くには国立天文台野辺山があります。
    transition: cut
    voice_override:
      voice: narrator_male
      speed: 0.95
  - id: antena
    image: assets/images/DSC00059.bmp
    duration: 5
    teletext:
      text: 電波望遠鏡
      position: top_left
      style:
        fill: "#FFE066"
        stroke: "#222222"
    voiceover: >
      大きな電波望遠鏡が迎えてくれます。
    transition: cut
    voice_override:
      voice: narrator_male
      speed: 0.95
options:
  voice_cache_dir: .cache/voice
  subtitle_format: burn
  keep_temp: false
  workers: 1
