video:
  width: 1920
  height: 1080
  fps: 30
  voice: narrator_male
  subtitle:
    position: bottom
    style:
      fill: "#FFFFFF"
      stroke: "#000000"
      padding: 32
scenes:
  - id: 1-1
    image: output/scene_1-1.png
    teletext:
      text: "オープニング"
      position: top_left
      style:
        fill: "#FFE066"
        stroke: "#222222"
    voiceover: |
      日本では、胃の中に住み着く細菌「ヘリコバクター・ピロリ」―
      通称「ピロリ菌」が、少なくとも3,000万人以上の人々に
      感染していると考えられています。
      ピロリ菌は、胃がんや胃・十二指腸潰瘍の主な原因であり、
      日本における胃がんの99％がピロリ菌感染が
      原因であると言われています。
      しかし、ピロリ菌について正しく理解している
      人はまだ多くありません。
      今回は、ピロリ菌の基本的な仕組みから、感染経路、症状、
      診断法、治療法、そして予防法まで、
      5章にわたって解説していきます。
    transition: cut
    voice_override:
      voice: narrator_male
      speed: 1.0

  - id: 1-2
    image: output/scene_1-2.png
    teletext:
      text: "細菌の発見"
      position: top_left
      style:
        fill: "#FFE066"
        stroke: "#222222"
    voiceover: |
      ピロリ菌の正式名称は
      「ヘリコバクター・ピロリ（Helicobacter pylori）」です。
      1982年にオーストラリアの医師、バリー・マーシャルと
      ロビン・ウォーレンによって発見されました。
      当時、胃の中は強い酸性のため細菌は生存できないと
      考えられていましたが、ピロリ菌は「ウレアーゼ」という
      酵素を出してアンモニアを生成し、
      周囲の胃酸を中和しながら生息できることがわかったのです。
      この発見により、マーシャルとウォーレンは
      後にノーベル生理学・医学賞を受賞しました。
    transition: cut
    voice_override:
      voice: narrator_male
      speed: 1.0

options:
  voice_cache_dir: .cache/voice
  subtitle_format: burn
  keep_temp: false
  workers: 1
